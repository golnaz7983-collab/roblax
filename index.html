<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROBLAX | دنیای بازی‌های تو</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b1020;color:#eef2ff;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}.side{width:250px;background:#11182c;border-left:1px solid #26304b;padding:20px;position:sticky;top:0;height:100vh}
.brand{font-size:29px;font-weight:900;letter-spacing:1px;color:#fff;margin-bottom:24px}.brand span{color:#7c5cff}
.nav button{width:100%;text-align:right;background:transparent;color:#aeb8d2;padding:13px 14px;border-radius:12px;margin:3px 0}.nav button:hover,.nav button.active{background:#202a46;color:#fff}
.userbox{position:absolute;bottom:20px;right:20px;left:20px;background:#18213a;border:1px solid #2b3859;padding:12px;border-radius:15px}
.avatarMini{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:#7c5cff;margin-left:8px}
.main{flex:1;padding:22px;max-width:1500px;margin:auto;width:100%}.top{display:flex;gap:12px;align-items:center;margin-bottom:20px}.search{flex:1;background:#141d34;border:1px solid #2a3655;color:#fff;padding:13px 16px;border-radius:14px;outline:none}.coins{background:#17213a;padding:11px 15px;border-radius:14px;color:#ffd66b;font-weight:700}
.hero{padding:34px;border-radius:25px;background:linear-gradient(135deg,#18284e,#3a2671);border:1px solid #4b4b8b;margin-bottom:22px}.hero h1{font-size:38px;margin:0 0 10px}.hero p{color:#d1d8f0}.primary{background:#7c5cff;color:white;padding:12px 18px;border-radius:12px;font-weight:700}.secondary{background:#263452;color:#fff;padding:11px 16px;border-radius:12px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}
.card{background:#141d34;border:1px solid #273451;border-radius:18px;padding:15px}.gameCover{height:130px;border-radius:14px;background:linear-gradient(135deg,#263a66,#7c5cff);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:12px}.minecraftCover{background:linear-gradient(#65c8ff 0 58%,#6dc84a 58% 76%,#8b5a32 76%);position:relative;overflow:hidden}.minecraftCover:after{content:'🟩 🟫 🪨 🌳';position:absolute;bottom:10px;left:0;right:0;font-size:28px;letter-spacing:5px}.card h3{margin:8px 0}.muted{color:#93a0be;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{background:#222d49;color:#b9c6e6;padding:5px 8px;border-radius:8px;font-size:12px}
.panel{background:#141d34;border:1px solid #273451;border-radius:18px;padding:18px}.shopItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #25304a}.shopItem:last-child{border:0}
.modal{position:fixed;inset:0;background:#050817cc;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#11182c;border:1px solid #354362;border-radius:22px;padding:22px;box-shadow:0 25px 80px #0008}
input,textarea,select{width:100%;background:#0d1427;border:1px solid #2d3a59;color:#fff;padding:12px;border-radius:11px;outline:none;margin:6px 0 12px}textarea{min-height:90px;resize:vertical}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.close{float:left;background:#283552;color:#fff;padding:8px 12px;border-radius:10px}
.avatar3d{width:190px;height:260px;margin:10px auto 20px;position:relative;filter:drop-shadow(0 18px 15px #0007)}.head{width:105px;height:105px;background:#f1c27d;border-radius:26px;position:absolute;top:0;left:42px;border:5px solid #222}.hair{position:absolute;top:-7px;left:6px;right:6px;height:42px;border-radius:22px 22px 8px 8px;background:#171b2a}.eye{position:absolute;top:48px;width:11px;height:11px;background:#111;border-radius:50%}.e1{left:25px}.e2{right:25px}.body3{width:110px;height:115px;background:#6d4aff;position:absolute;top:103px;left:40px;border-radius:18px}.leg{width:45px;height:72px;background:#242d48;position:absolute;top:210px;border-radius:10px}.l1{left:42px}.l2{right:42px}.arm{width:32px;height:92px;background:#f1c27d;position:absolute;top:110px;border-radius:15px}.a1{left:10px;transform:rotate(10deg)}.a2{right:10px;transform:rotate(-10deg)}
.chat{height:330px;overflow:auto;background:#0c1324;border-radius:14px;padding:12px}.msg{background:#18233c;padding:9px 12px;border-radius:12px;margin:7px 0;max-width:85%}.msg b{color:#bdaeff}.online{color:#58e6a5}.toast{position:fixed;bottom:20px;left:20px;background:#171f35;border:1px solid #394967;padding:12px 16px;border-radius:12px;display:none;z-index:50}.toast.show{display:block}
.playArea{min-height:320px;background:#0b1222;border-radius:18px;padding:18px;position:relative;overflow:hidden}.target{position:absolute;width:58px;height:58px;border-radius:50%;background:#7c5cff;display:none;align-items:center;justify-content:center;font-size:24px}.score{font-size:22px;font-weight:800;color:#ffd66b}
@media(max-width:800px){.side{width:75px;padding:10px}.brand{font-size:0}.brand:after{content:'R';font-size:28px}.nav button{font-size:0;text-align:center}.nav button:before{font-size:20px}.nav button:nth-child(1):before{content:'⌂'}.nav button:nth-child(2):before{content:'🎮'}.nav button:nth-child(3):before{content:'🛒'}.nav button:nth-child(4):before{content:'👥'}.nav button:nth-child(5):before{content:'🧑'}.userbox{font-size:0;right:8px;left:8px}.avatarMini{margin:0}.hero h1{font-size:28px}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">ROBL<span>AX</span></div><div class="nav">
<button class="active" onclick="page('home')">خانه</button><button onclick="page('games')">بازی‌ها</button><button onclick="page('shop')">فروشگاه</button><button onclick="page('friends')">دوستان</button><button onclick="page('profile')">پروفایل</button>
</div><div class="userbox"><span class="avatarMini" id="mini">🙂</span><b id="userName">مهمان</b><div class="muted">حساب بدون ایمیل</div></div></aside>
<main class="main"><div class="top"><input class="search" id="search" placeholder="جستجوی بازی..." oninput="renderGames()"><div class="coins">🪙 <span id="coinText">1250</span></div><button class="secondary" onclick="openChat()">💬</button></div><div id="content"></div></main>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://qqwifsgnzweslkcyuqmg.supabase.co';
const SUPABASE_KEY='sb_publishable_AI6rSMSOAag61TCJzapLbg_frex6ks9';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KEY='roblaxAccountV2';
let me=JSON.parse(localStorage.getItem(KEY)||'null');
let games=[],inventory=[],friends=[];
const items=[
{id:'neon-glasses',name:'عینک نئون',price:120,emoji:'🕶️'},
{id:'gold-hat',name:'کلاه طلایی',price:250,emoji:'👑'},
{id:'speed-shoes',name:'کفش سرعت',price:180,emoji:'👟'},
{id:'gaming-headset',name:'هدفون گیمینگ',price:300,emoji:'🎧'},
{id:'sky-wings',name:'بال آسمانی',price:500,emoji:'🪽'},
{id:'laser-sword',name:'شمشیر لیزری',price:420,emoji:'⚔️'}
];
const seed=[
['Minecraft: دنیای مکعبی','دنیای سه‌بعدی رنگی؛ بلوک بساز، بشکن و کاوش کن','ماجراجویی','minecraft','⛏️'],
['شهر رویایی','یک شهر آزاد برای گشت‌وگذار','شهر','coin-rush','🏙️'],['نبرد قهرمانان','نبرد سریع و امتیازی','اکشن','target','⚔️'],['جزیره ماجراجویی','جمع‌آوری سکه در جزیره','ماجراجویی','coin-rush','🏝️'],['مسابقه سرعت','تا جایی که می‌توانی امتیاز بگیر','مسابقه','target','🏎️'],['حیوانات دوست‌داشتنی','دنیای آرام و سرگرم‌کننده','اجتماعی','coin-rush','🐾'],['فرار از زامبی‌ها','بازی واکنش سریع','ترسناک','target','🧟']
];
function id(){return crypto.randomUUID()} function save(){localStorage.setItem(KEY,JSON.stringify(me))}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function modal(x){document.getElementById('modalBox').innerHTML=x;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function ensureUser(){
 if(!me){modal('<h2>به ROBLAX خوش آمدی 🎮</h2><p class="muted">یک نام کاربری انتخاب کن؛ ایمیل لازم نیست.</p><input id="loginName" placeholder="مثلاً Gamer123"><button class="primary" onclick="register()">ورود به دنیای ROBLAX</button>');return false}
 const {data}=await db.from('roblax_profiles').select('*').eq('client_id',me.id).maybeSingle();
 if(data){me={...me,...data};save()} else await db.from('roblax_profiles').insert({client_id:me.id,username:me.username,coins:1250,avatar:me.avatar||{}});return true
}
async function register(){
 const username=(document.getElementById('loginName').value||'').trim().replace(/[^\p{L}\p{N}_-]/gu,'').slice(0,18);
 if(username.length<3)return toast('نام کاربری حداقل ۳ حرف باشد');
 const {data:dup}=await db.from('roblax_profiles').select('client_id').eq('username',username).maybeSingle();
 if(dup)return toast('این نام کاربری قبلاً گرفته شده');
 me={id:id(),username,coins:1250,avatar:{skin:'#f1c27d',shirt:'#6d4aff',hair:'#171b2a'}};save();
 await db.from('roblax_profiles').insert({client_id:me.id,username,coins:1250,avatar:me.avatar});closeModal();boot();
}
async function boot(){
 if(!(await ensureUser()))return;
 document.getElementById('userName').textContent=me.username;document.getElementById('coinText').textContent=me.coins||0;document.getElementById('mini').textContent='🙂';
 await loadGames(); await loadInventory(); await loadFriends(); page('home'); subscribe();
}
async function loadGames(){
 const r=await db.from('roblax_games').select('*').order('created_at',{ascending:false});games=r.data||[];
 if(!games.length){for(const s of seed)await db.from('roblax_games').insert({owner_id:me.id,owner_name:'ROBLAX',title:s[0],description:s[1],genre:s[2],template:s[3]});const r2=await db.from('roblax_games').select('*').order('created_at',{ascending:false});games=r2.data||[]}
}
async function loadInventory(){const r=await db.from('roblax_inventory').select('*').eq('client_id',me.id);inventory=r.data||[]}
async function loadFriends(){const r=await db.from('roblax_friends').select('*').eq('client_id',me.id);friends=r.data||[]}
function page(p){
 document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['home','games','shop','friends','profile'][i]===p));
 if(p==='home')home(); if(p==='games')gamesPage();if(p==='shop')shopPage();if(p==='friends')friendsPage();if(p==='profile')profilePage()
}
function home(){document.getElementById('content').innerHTML=`
<section class="hero"><h1>دنیای خودت را بساز! 🚀</h1><p>بازی بساز، آواتارت را شخصی‌سازی کن، دوستانت را پیدا کن و بازی‌های کوچک و قابل اجرا را همین‌جا تجربه کن.</p><button class="primary" onclick="createGame()">＋ ساخت بازی</button></section>
<div class="sectionTitle"><h2>بازی‌های پیشنهادی</h2><button class="secondary" onclick="page('games')">همه بازی‌ها</button></div><div class="grid" id="homeGames"></div>
<div class="sectionTitle"><h2>💬 گفت‌وگوی عمومی</h2><button class="secondary" onclick="openChat()">باز کردن چت</button></div>
<div class="panel"><span class="online">● آنلاین</span> &nbsp; چت زنده با بازیکنان ROBLAX</div>`;renderGames('homeGames')}
function renderGames(target='gamesList'){
 const q=(document.getElementById('search').value||'').toLowerCase();const arr=games.filter(g=>(g.title+' '+g.genre+' '+g.description).toLowerCase().includes(q));const el=document.getElementById(target);if(!el)return;
 el.innerHTML=arr.slice(0,target==='homeGames'?6:99).map(g=>card(g)).join('')||'<div class="panel">بازی‌ای پیدا نشد.</div>'
}
function card(g){const icon=g.template==='minecraft'?'⛏️':g.genre==='اکشن'?'⚔️':g.genre==='مسابقه'?'🏎️':g.genre==='ترسناک'?'🧟':'🎮';const cover=g.template==='minecraft'?'minecraftCover':'';return `<div class="card"><div class="gameCover ${cover}">${icon}</div><div class="row"><span class="tag">${g.genre}</span><span class="muted">▶ ${g.plays||0}</span></div><h3>${esc(g.title)}</h3><p class="muted">${esc(g.description)}</p><div class="row"><span>⭐ ${g.rating||5}</span><button class="primary" onclick="playGame('${g.id}')">بازی</button></div></div>`}
function gamesPage(){document.getElementById('content').innerHTML='<div class="sectionTitle"><h2>🎮 همه بازی‌ها</h2><button class="primary" onclick="createGame()">＋ ساخت بازی</button></div><div class="grid" id="gamesList"></div>';renderGames()}
function createGame(){modal(`<button class="close" onclick="closeModal()">بستن</button><h2>🛠️ ساخت بازی</h2><p class="muted">بازی ساخته‌شده برای همه بازیکنان قابل مشاهده است.</p><label>نام بازی<input id="gTitle" maxlength="35" placeholder="مثلاً شهر من"></label><label>توضیح<textarea id="gDesc" maxlength="140" placeholder="توضیح کوتاه"></textarea></label><div class="formgrid"><label>ژانر<select id="gGenre"><option>ماجراجویی</option><option>اکشن</option><option>مسابقه</option><option>اجتماعی</option><option>ترسناک</option></select></label><label>نوع بازی<select id="gTemplate"><option value="coin-rush">جمع‌کردن سکه</option><option value="target">زدن هدف</option><option value="minecraft">دنیای مکعبی سه‌بعدی</option></select></label></div><button class="primary" onclick="saveGame()">ساخت و انتشار 🚀</button>`)}
async function saveGame(){const title=document.getElementById('gTitle').value.trim();if(title.length<2)return toast('نام بازی را وارد کن');const {data,error}=await db.from('roblax_games').insert({owner_id:me.id,owner_name:me.username,title,description:document.getElementById('gDesc').value.trim(),genre:document.getElementById('gGenre').value,template:document.getElementById('gTemplate').value}).select().single();if(error)return toast('ساخت بازی انجام نشد');games.unshift(data);closeModal();toast('بازی منتشر شد 🚀');gamesPage()}
function shopPage(){document.getElementById('content').innerHTML='<div class="sectionTitle"><h2>🛒 فروشگاه</h2><span class="muted">سکه‌ها برای همین حساب ذخیره می‌شوند.</span></div><div class="panel">'+items.map(i=>`<div class="shopItem"><div><b>${i.emoji} ${i.name}</b><div class="muted">${i.price} سکه</div></div><button class="primary" onclick="buy('${i.id}')">${inventory.some(x=>x.item_id===i.id)?'خرید شده':'خرید'}</button></div>`).join('')+'</div>'}
async function buy(itemId){if(inventory.some(x=>x.item_id===itemId))return toast('این وسیله را داری');const it=items.find(x=>x.id===itemId);if(me.coins<it.price)return toast('سکه کافی نیست');me.coins-=it.price;const r=await db.from('roblax_profiles').update({coins:me.coins,updated_at:new Date().toISOString()}).eq('client_id',me.id);if(r.error){me.coins+=it.price;return toast('خرید ناموفق بود')}await db.from('roblax_inventory').insert({client_id:me.id,item_id:it.id,item_name:it.name,price:it.price});await loadInventory();save();document.getElementById('coinText').textContent=me.coins;shopPage();toast('خرید انجام شد 🎉')}
function friendsPage(){document.getElementById('content').innerHTML=`<div class="sectionTitle"><h2>👥 دوستان</h2></div><div class="panel"><input id="friendSearch" placeholder="نام کاربری را وارد کن"><button class="primary" onclick="findFriend()">پیدا کردن</button><div id="friendResult"></div></div><div class="sectionTitle"><h2>لیست دوستان</h2></div><div class="grid">${friends.map(f=>`<div class="card"><b>🙂 ${esc(f.friend_name)}</b><p class="online">● ${f.status}</p></div>`).join('')||'<div class="panel">هنوز دوستی اضافه نکرده‌ای.</div>'}</div>`}
async function findFriend(){const q=document.getElementById('friendSearch').value.trim();if(!q)return;const r=await db.from('roblax_profiles').select('client_id,username').ilike('username','%'+q+'%').limit(8);document.getElementById('friendResult').innerHTML=(r.data||[]).filter(x=>x.client_id!==me.id).map(x=>`<div class="shopItem"><b>🙂 ${esc(x.username)}</b><button class="primary" onclick="addFriend('${x.client_id}','${esc(x.username)}')">افزودن</button></div>`).join('')||'<p class="muted">بازیکنی پیدا نشد.</p>'}
async function addFriend(fid,name){const r=await db.from('roblax_friends').upsert({client_id:me.id,friend_id:fid,friend_name:name,status:'online'},{onConflict:'client_id,friend_id'});if(r.error)return toast('افزودن ناموفق');await loadFriends();toast('به دوستان اضافه شد');friendsPage()}
function profilePage(){document.getElementById('content').innerHTML=`<div class="sectionTitle"><h2>🧑 پروفایل</h2></div><div class="panel"><div class="avatar3d"><div class="head" style="background:${me.avatar?.skin||'#f1c27d'}"><div class="hair" style="background:${me.avatar?.hair||'#171b2a'}"></div><div class="eye e1"></div><div class="eye e2"></div></div><div class="body3" style="background:${me.avatar?.shirt||'#6d4aff'}"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><h2 style="text-align:center">${esc(me.username)}</h2><p style="text-align:center" class="muted">🪙 ${me.coins} سکه • ${inventory.length} وسیله</p><button class="primary" onclick="avatarEditor()">🎨 ویرایش آواتار</button></div>`}
function avatarEditor(){modal(`<button class="close" onclick="closeModal()">بستن</button><h2>🎨 سازنده آواتار</h2><div class="formgrid"><label>رنگ پوست<input id="skin" type="color" value="${me.avatar?.skin||'#f1c27d'}"></label><label>رنگ لباس<input id="shirt" type="color" value="${me.avatar?.shirt||'#6d4aff'}"></label><label>رنگ مو<input id="hair" type="color" value="${me.avatar?.hair||'#171b2a'}"></label></div><button class="primary" onclick="saveAvatar()">ذخیره آواتار</button>`)}
async function saveAvatar(){me.avatar={skin:skin.value,shirt:shirt.value,hair:hair.value};save();await db.from('roblax_profiles').update({avatar:me.avatar,updated_at:new Date().toISOString()}).eq('client_id',me.id);closeModal();profilePage();toast('آواتار ذخیره شد')}
async function playGame(gameId){const g=games.find(x=>x.id===gameId);if(!g)return;if(g.template==='minecraft'){await db.from('roblax_games').update({plays:(g.plays||0)+1}).eq('id',g.id);g.plays=(g.plays||0)+1;modal(`<button class="close" onclick="closeModal()">خروج</button><h2>⛏️ ${esc(g.title)}</h2><p class="muted">دنیای سه‌بعدی رنگی داخل خود سایت</p><iframe src="minecraft.html" style="width:100%;height:620px;border:0;border-radius:16px;background:#72c7ff" allow="pointer-lock"></iframe>`);return;await db.from('roblax_games').update({plays:(g.plays||0)+1}).eq('id',g.id);g.plays=(g.plays||0)+1;modal(`<button class="close" onclick="closeModal()">خروج</button><h2>🎮 ${esc(g.title)}</h2><p class="muted">${esc(g.description)}</p><div class="playArea" id="playArea"><div class="score">امتیاز: <span id="score">0</span></div><div class="target" id="target">🎯</div><div style="text-align:center;margin-top:80px"><button class="primary" id="startBtn" onclick="startMini('${g.template}','${g.id}')">شروع بازی</button><p class="muted">نسخه وبِ قابل بازی همین صفحه</p></div></div>`)}
let timer,score=0;
function startMini(type,gid){clearInterval(timer);score=0;document.getElementById('score').textContent=0;document.getElementById('startBtn').style.display='none';const t=document.getElementById('target');let left=0;if(type==='target'){t.style.display='flex';moveTarget();t.onclick=()=>{score+=10;document.getElementById('score').textContent=score;moveTarget()};timer=setInterval(()=>{left++;if(left>=20)finishMini(gid)},1000)}else{t.style.display='flex';t.textContent='🪙';moveTarget();t.onclick=()=>{score+=5;document.getElementById('score').textContent=score;moveTarget()};timer=setInterval(()=>{left++;if(left>=20)finishMini(gid)},1000)}}
function moveTarget(){const a=document.getElementById('playArea'),t=document.getElementById('target');t.style.left=(Math.random()*Math.max(1,a.clientWidth-75))+'px';t.style.top=(80+Math.random()*Math.max(1,a.clientHeight-150))+'px'}
async function finishMini(gid){clearInterval(timer);document.getElementById('target').style.display='none';await db.from('roblax_scores').insert({game_id:gid,client_id:me.id,username:me.username,score});toast('بازی تمام شد! امتیاز '+score);document.getElementById('startBtn').style.display='inline-block';document.getElementById('startBtn').textContent='دوباره بازی کن'}
async function openChat(){const r=await db.from('roblax_chat').select('*').order('created_at',{ascending:true}).limit(80);modal(`<button class="close" onclick="closeModal()">بستن</button><h2>💬 چت عمومی</h2><div class="chat" id="chatBox">${(r.data||[]).map(m=>msg(m)).join('')}</div><div class="row" style="margin-top:10px"><input id="chatInput" placeholder="پیامت را بنویس..." onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">ارسال</button></div>`);let c=document.getElementById('chatBox');c.scrollTop=c.scrollHeight}
function msg(m){return `<div class="msg"><b>${esc(m.username)}</b><br>${esc(m.text)}</div>`}
async function sendChat(){const x=document.getElementById('chatInput');const text=x.value.trim();if(!text)return;await db.from('roblax_chat').insert({client_id:me.id,username:me.username,text});x.value='';const r=await db.from('roblax_chat').select('*').order('created_at',{ascending:true}).limit(80);const c=document.getElementById('chatBox');if(c){c.innerHTML=(r.data||[]).map(msg).join('');c.scrollTop=c.scrollHeight}}
function subscribe(){db.channel('roblax-live').on('postgres_changes',{event:'*',schema:'public',table:'roblax_chat'},()=>{if(document.getElementById('chatBox'))openChat()}).on('postgres_changes',{event:'*',schema:'public',table:'roblax_games'},async()=>{await loadGames();renderGames('homeGames');renderGames('gamesList')}).subscribe()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
boot();
</script>
