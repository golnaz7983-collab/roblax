<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBLAX | دنیای مکعبی</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#75c8ff;font-family:Tahoma,Arial;color:white}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}.panel{background:#111a2dcc;border:2px solid #ffffff33;border-radius:14px;padding:10px 14px;text-shadow:0 2px 3px #000}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;text-shadow:0 2px 4px #000}.help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);text-align:center;background:#111a2dcc;border-radius:14px;padding:9px 14px;font-size:13px}.hotbar{position:absolute;bottom:12px;right:12px;display:flex;gap:5px}.slot{width:48px;height:48px;background:#18213cdd;border:2px solid #fff5;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:24px}.slot.active{border-color:#ffe066;background:#34415ddd}.notice{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#111a2df2;padding:25px;border-radius:18px;text-align:center;border:1px solid #ffffff33}.notice button{background:#7c5cff;color:#fff;border:0;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer}</style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="panel">🌳 دنیای مکعبی ROBLAX</div><div class="panel">❤️ 100 &nbsp; | &nbsp; 🟩 بلوک: <span id="blockName">چمن</span></div></div><div class="cross">＋</div><div class="help">WASD حرکت • Space پرش • کلیک چپ شکستن • کلیک راست گذاشتن • 1 تا 5 انتخاب بلوک • Esc خروج</div><div class="hotbar" id="hotbar"></div><div class="notice" id="start"><h2>🌍 شروع دنیای مکعبی</h2><p>یک دنیای سه‌بعدی رنگی و قابل بازی داخل خود سایت.</p><button id="startBtn">ورود به بازی</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x72c7ff);scene.fog=new THREE.Fog(0x72c7ff,20,70);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,150);camera.position.set(0,5,8);
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbde9ff,0x557040,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(25,40,15);scene.add(sun);
const mats={grass:new THREE.MeshLambertMaterial({color:0x55b947}),dirt:new THREE.MeshLambertMaterial({color:0x8b5a32}),stone:new THREE.MeshLambertMaterial({color:0x7c8490}),wood:new THREE.MeshLambertMaterial({color:0x9a6335}),sand:new THREE.MeshLambertMaterial({color:0xe8cf72}),water:new THREE.MeshLambertMaterial({color:0x37aeea,transparent:true,opacity:.65})};
const names={grass:'چمن',dirt:'خاک',stone:'سنگ',wood:'چوب',sand:'شن'};const types=['grass','dirt','stone','wood','sand'];let selected=0;
const world=new Map(),geo=new THREE.BoxGeometry(1,1,1),meshes=new Map();
const key=(x,y,z)=>x+','+y+','+z;
function put(x,y,z,t){if(y<0)return;const k=key(x,y,z);if(world.has(k))return;world.set(k,t);const m=new THREE.Mesh(geo,mats[t]);m.position.set(x+.5,y+.5,z+.5);m.userData={x,y,z};scene.add(m);meshes.set(k,m)}
function remove(x,y,z){const k=key(x,y,z),m=meshes.get(k);if(!m)return;scene.remove(m);world.delete(k);meshes.delete(k)}
function height(x,z){return Math.max(1,Math.floor(2+Math.sin(x*.34)*1.2+Math.cos(z*.28)*1.1+Math.sin((x+z)*.16)*.7))}
for(let x=-18;x<18;x++)for(let z=-18;z<18;z++){const h=height(x,z);for(let y=0;y<h;y++)put(x,y,z,y===h-1?'grass':y>h-4?'dirt':'stone');if(Math.random()<.045&&h>2){for(let y=h;y<h+3;y++)put(x,y,z,'wood');for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)for(let dy=2;dy<=3;dy++)if(Math.abs(dx)+Math.abs(dz)+dy<5)put(x+dx,h+dy,z+dz,'grass')}}
for(let x=-8;x<8;x++)for(let z=-8;z<8;z++)if(!world.has(key(x,0,z)))put(x,0,z,'sand');
const keys=['1','2','3','4','5'];const hb=document.getElementById('hotbar');types.forEach((t,i)=>{const d=document.createElement('div');d.className='slot'+(i===0?' active':'');d.textContent=['🟩','🟫','⬜','🪵','🟨'][i];d.title=keys[i]+' '+names[t];hb.appendChild(d)});function select(i){selected=(i+types.length)%types.length;document.querySelectorAll('.slot').forEach((e,j)=>e.classList.toggle('active',j===selected));document.getElementById('blockName').textContent=names[types[selected]]}select(0);
let locked=false;document.getElementById('startBtn').onclick=()=>renderer.domElement.requestPointerLock();renderer.domElement.addEventListener('click',()=>{if(!locked)renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;document.getElementById('start').style.display=locked?'none':'block'});
const keysDown={};addEventListener('keydown',e=>{keysDown[e.code]=true;if(e.code.startsWith('Digit')){const n=+e.code.slice(5);if(n>=1&&n<=5)select(n-1)}});addEventListener('keyup',e=>keysDown[e.code]=false);
let yaw=0,pitch=-.18,velY=0,onGround=false;document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0024;pitch-=e.movementY*.0024;pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.set(pitch,yaw,0,'YXZ')});
function solid(x,y,z){return world.has(key(Math.floor(x),Math.floor(y),Math.floor(z)))}
function interact(place){const ray=new THREE.Raycaster();ray.setFromCamera({x:0,y:0},camera);const hits=ray.intersectObjects([...meshes.values()],false);if(!hits.length||hits[0].distance>6)return;const h=hits[0],p=h.object.userData;if(place){const n=h.face.normal;const x=p.x+Math.round(n.x),y=p.y+Math.round(n.y),z=p.z+Math.round(n.z);if(y>=0&&y<25&&!solid(x,y,z))put(x,y,z,types[selected])}else remove(p.x,p.y,p.z)}
addEventListener('mousedown',e=>{if(!locked)return;e.preventDefault();interact(e.button===2)});addEventListener('contextmenu',e=>e.preventDefault());
function update(dt){const speed=keysDown.ShiftLeft?8:5;const dir=new THREE.Vector3((keysDown.KeyD?1:0)-(keysDown.KeyA?1:0),0,(keysDown.KeyS?1:0)-(keysDown.KeyW?1:0));if(dir.lengthSq())dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.x+=dir.x*speed*dt;camera.position.z+=dir.z*speed*dt;velY-=18*dt;if(keysDown.Space&&onGround){velY=7;onGround=false}camera.position.y+=velY*dt;if(camera.position.y<1.7){camera.position.y=1.7;velY=0;onGround=true}}
let last=performance.now();function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
